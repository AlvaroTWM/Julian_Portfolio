    <path d="M481 446 C476 460 466 474 470 482 C474 486 478 482 481 478 C484 482 488 486 492 482 C496 474 486 460 481 446 Z" fill="#121212"/>
    <!-- teeth gap / mouth line with grin -->
    <path d="M404 512 C440 522 520 522 560 512 L552 528 C520 534 440 534 410 528 Z" fill="#121212"/>
