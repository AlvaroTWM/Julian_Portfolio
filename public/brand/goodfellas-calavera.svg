      <path d="M482 499 L482 522"/><path d="M501 499 L501 522"/><path d="M520 498 L519 521"/><path d="M539 496 L537 518"/>
      <path d="M412 495 C450 503 514 503 552 495" fill="none"/>
      <path d="M432 530 L433 552"/><path d="M451 532 L451 556"/><path d="M470 533 L470 557"/>
      <path d="M490 533 L490 557"/><path d="M509 532 L509 556"/><path d="M528 530 L527 552"/>
      <path d="M418 552 C455 562 507 562 544 552" fill="none"/>
    </g>
    <!-- smirk crease -->
    <path d="M556 504 C566 500 574 492 578 482" stroke="#121212" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- straw hat (tilted) -->
    <g transform="rotate(-2 480 300)">
