      <ellipse cx="482" cy="350" rx="118" ry="20" fill="#121212"/>
      <!-- brim -->
      <path d="M248 300 C248 262 360 246 482 246 C604 246 716 262 716 300 C716 336 604 352 482 352 C360 352 248 336 248 300 Z" fill="#F4F1EA"/>
      <path d="M248 300 C248 336 360 352 482 352 C604 352 716 336 716 300 C700 326 600 338 482 338 C364 338 264 326 248 300 Z" fill="#121212"/>
      <!-- crown -->
      <path d="M372 292 C368 220 404 168 482 168 C560 168 596 220 592 292 C560 304 404 304 372 292 Z" fill="#F4F1EA"/>
      <!-- band -->
      <path d="M373 262 C410 274 554 274 591 262 L592 292 C556 304 408 304 372 292 Z" fill="#121212"/>
