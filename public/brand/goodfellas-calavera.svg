             C600 462 598 492 572 502 L558 512 L402 512 L388 502 C362 492 360 462 376 448
             C366 430 362 408 360 370 Z" fill="#F4F1EA"/>
    <!-- jaw -->
    <path d="M412 528 L550 528 C552 556 540 584 518 598 C498 608 464 608 444 598 C422 584 410 556 412 528 Z" fill="#F4F1EA"/>
    <!-- cheek hollows -->
    <path d="M378 470 C386 484 396 494 408 500 L396 504 C386 496 380 484 378 470 Z" fill="#121212"/>
    <path d="M582 470 C574 484 564 494 552 500 L564 504 C574 496 580 484 582 470 Z" fill="#121212"/>
