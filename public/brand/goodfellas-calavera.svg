        <path d="M378 232 C420 242 544 242 586 232"/>
        <path d="M388 206 C430 214 534 214 576 206"/>
        <path d="M408 184 C440 190 524 190 556 184"/>
      </g>
      <!-- weave lines brim -->
      <g stroke="#121212" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M282 296 C300 278 380 268 400 268"/>
        <path d="M682 296 C664 278 584 268 564 268"/>
        <path d="M300 312 C330 326 400 334 440 336"/>
        <path d="M664 312 C634 326 564 334 524 336"/>
      </g>
      <!-- frayed straw ends on brim -->
      <g stroke="#F4F1EA" stroke-width="4" stroke-linecap="round">
        <path d="M252 306 L238 316"/><path d="M262 318 L252 332"/><path d="M712 306 L728 314"/><path d="M700 320 L712 334"/>
      </g>
      <!-- crown highlight -->
      <path d="M420 196 C432 182 452 176 470 176" stroke="#F4F1EA" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>

    </g>

    <!-- mano esquelética con pucho (se anima hacia la boca) -->
    <g id="mano">
    <g fill="#F4F1EA">
      <rect x="652" y="520" width="15" height="100" rx="7.5" transform="rotate(-16 660 520)"/>
      <rect x="680" y="520" width="15" height="92" rx="7.5" transform="rotate(-16 688 520)"/>
      <ellipse cx="660" cy="517" rx="11" ry="8"/><ellipse cx="682" cy="516" rx="11" ry="8"/><ellipse cx="704" cy="519" rx="10" ry="8"/>
    </g>
    <g transform="rotate(-20 660 418)">
      <rect x="640" y="411" width="126" height="14" rx="3" fill="#F4F1EA"/>
      <path d="M752 411 L752 425 M760 411 L760 425" stroke="#121212" stroke-width="3"/>
      <circle id="brasa" cx="770" cy="418" r="7" fill="#F4F1EA"/>
    </g>
    <g fill="#F4F1EA">
      <rect x="624" y="410" width="38" height="20" rx="10"/><rect x="666" y="412" width="40" height="20" rx="10"/>
      <rect x="624" y="436" width="38" height="20" rx="10"/><rect x="666" y="438" width="42" height="20" rx="10"/>
      <rect x="628" y="462" width="36" height="19" rx="9.5"/><rect x="668" y="464" width="40" height="19" rx="9.5"/>
      <rect x="634" y="487" width="32" height="17" rx="8.5"/><rect x="670" y="488" width="36" height="17" rx="8.5"/>
      <rect x="712" y="420" width="16" height="80" rx="8"/>
      <rect x="712" y="384" width="18" height="50" rx="9"/>
      <rect x="692" y="368" width="36" height="16" rx="8" transform="rotate(-20 710 376)"/>
    </g>

    
  <g id="humo" stroke="#F4F1EA" fill="none" stroke-linecap="round">
    <path d="M764 366 C752 340 782 326 770 300 C760 280 788 264 776 240 C768 222 790 208 782 188" stroke-width="5" opacity="0.9"/>
    <path d="M770 330 C786 314 774 298 790 282 C802 270 794 256 806 244" stroke-width="3.5" opacity="0.75"/>
    <path d="M760 320 C744 304 758 288 744 270" stroke-width="3" opacity="0.6"/>
  </g>
    </g>
    </g>
    

  </g>
</svg>
